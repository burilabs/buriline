[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buriline"
version = "0.1.0"
description = "Offline production and warehouse analytics with a local language model. No data leaves the plant."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "BuriLabs"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
buriline = "buriline.cli:main"

[tool.setuptools.packages.find]
include = ["buriline*"]

[tool.setuptools.package-data]
"buriline.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
